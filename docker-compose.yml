name: kyrae-platform

services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: kyrae-backend
    restart: unless-stopped
    env_file:
      - ${SERVER_ROOT:?SERVER_ROOT is required}/secrets/kyrae/backend.env
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: kyrae-postgres
      DB_PORT: 5432
      DB_NAME: DbKyrae
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      kyrae-network:
        aliases:
          - kyrae-backend

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
    container_name: kyrae-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      kyrae-network:
        aliases:
          - kyrae-frontend

networks:
  kyrae-network:
    external: true
