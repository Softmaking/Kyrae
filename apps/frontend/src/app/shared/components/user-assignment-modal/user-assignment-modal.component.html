<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40" (click)="close.emit()">
  <div class="w-full max-w-lg rounded-2xl bg-white p-6 shadow-xl" (click)="$event.stopPropagation()">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-lg font-bold text-gray-800">{{ title }}</h2>
      <button (click)="close.emit()" class="rounded-lg p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600">&times;</button>
    </div>

    <div class="mb-4 flex gap-2">
      <select
        [(ngModel)]="selectedUserId"
        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none transition focus:border-brand-primary focus:ring-3 focus:ring-brand-primary/10"
      >
        <option value="">Selecciona un usuario</option>
        @for (user of unassignedUsers; track user.id) {
          <option [value]="user.id">{{ user.fullName }} ({{ user.email }})</option>
        }
      </select>
      <button
        (click)="onAdd()"
        [disabled]="!selectedUserId"
        class="rounded-lg bg-brand-primary px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-brand-primary-hover disabled:opacity-50"
      >
        Agregar
      </button>
    </div>

    @if (assignedUsers.length === 0) {
      <p class="py-4 text-center text-sm text-gray-400">No hay usuarios asignados</p>
    }

    <div class="max-h-64 space-y-2 overflow-y-auto">
      @for (user of assignedUsers; track user.id) {
        <div class="flex items-center justify-between rounded-lg border border-gray-200 px-3 py-2">
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium text-gray-800">{{ user.fullName }}</p>
            <p class="truncate text-xs text-gray-500">{{ user.email }}</p>
          </div>
          <button
            (click)="onRemove(user.id)"
            class="ml-2 rounded-lg px-2 py-1 text-xs font-medium text-red-600 transition-colors hover:bg-red-50"
          >
            Quitar
          </button>
        </div>
      }
    </div>

    <div class="mt-4 flex justify-end border-t border-gray-100 pt-4">
      <button
        (click)="close.emit()"
        class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50"
      >
        Cerrar
      </button>
    </div>
  </div>
</div>
