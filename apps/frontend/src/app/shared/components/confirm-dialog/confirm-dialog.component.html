<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40">
  <div class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-xl" (click)="$event.stopPropagation()">
    <h2 class="text-lg font-bold text-gray-800">{{ title }}</h2>
    <p class="mt-2 text-sm text-gray-600">{{ message }}</p>

    <div class="mt-6 flex justify-end gap-2">
      <button
        (click)="cancel.emit()"
        class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50"
      >
        {{ cancelLabel }}
      </button>
      <button
        (click)="confirm.emit()"
        [class.bg-red-600]="confirmDanger"
        [class.hover:bg-red-700]="confirmDanger"
        [class.bg-brand-primary]="!confirmDanger"
        [class.hover:bg-brand-primary-hover]="!confirmDanger"
        class="rounded-lg px-4 py-2 text-sm font-medium text-white transition-colors"
      >
        {{ confirmLabel }}
      </button>
    </div>
  </div>
</div>
