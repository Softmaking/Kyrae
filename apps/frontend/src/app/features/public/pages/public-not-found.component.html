<main class="flex min-h-screen items-center justify-center bg-gray-50 px-4">
  <div class="text-center">
    <p class="text-7xl font-bold text-blue-600">404</p>
    <h1 class="mt-4 text-2xl font-semibold text-gray-900">Página no encontrada</h1>
    <p class="mt-2 text-gray-500">La ruta a la que intentaste acceder no existe.</p>
    <button
      type="button"
      (click)="goBack()"
      class="mt-6 rounded-lg border border-gray-300 bg-white px-6 py-3 text-sm font-medium text-gray-700 transition hover:bg-gray-50"
    >
      Volver atrás
    </button>
  </div>
</main>
