<header class="admin-navbar fixed inset-x-0 top-0 z-30 border-b border-slate-200/80 bg-white/85 backdrop-blur-xl" [class.admin-navbar-collapsed]="sidebarCollapsed">
  <div class="flex h-20 items-center gap-3 px-4 sm:px-6 lg:px-8">
    <button
      type="button"
      class="inline-flex h-11 w-11 items-center justify-center rounded-2xl border border-slate-200 bg-white text-slate-600 shadow-sm transition hover:border-blue-200 hover:bg-blue-50 hover:text-blue-700 lg:hidden"
      aria-label="Abrir menu lateral"
      (click)="mobileMenuToggle.emit()"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>

    <button
      type="button"
      class="hidden h-11 w-11 items-center justify-center rounded-2xl border border-slate-200 bg-white text-slate-600 shadow-sm transition hover:border-blue-200 hover:bg-blue-50 hover:text-blue-700 lg:inline-flex"
      [attr.aria-label]="sidebarCollapsed ? 'Expandir menu lateral' : 'Colapsar menu lateral'"
      (click)="sidebarToggle.emit()"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>

    <div class="hidden min-w-0 flex-1 justify-center md:flex">
      <label class="relative w-full max-w-xl" for="admin-search">
        <span class="sr-only">Buscar</span>
        <svg class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
        <input id="admin-search" type="search" class="h-12 w-full rounded-2xl border border-slate-200 bg-slate-50 pl-12 pr-4 text-sm text-slate-700 outline-none transition placeholder:text-slate-400 focus:border-blue-300 focus:bg-white focus:ring-4 focus:ring-blue-100" placeholder="Buscar en el panel administrativo" />
      </label>
    </div>

    <div class="ml-auto flex items-center gap-2 sm:gap-3">
      <button type="button" class="relative inline-flex h-11 w-11 items-center justify-center rounded-2xl border border-slate-200 bg-white text-slate-600 shadow-sm transition hover:border-blue-200 hover:bg-blue-50 hover:text-blue-700" aria-label="Notificaciones">
        <span class="absolute right-3 top-3 h-2 w-2 rounded-sm bg-blue-600 ring-2 ring-white"></span>
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a3 3 0 1 1-5.714 0" />
        </svg>
      </button>

      <div class="relative">
        <button type="button" class="flex items-center gap-3 rounded-2xl border border-slate-200 bg-white py-1.5 pl-1.5 pr-3 shadow-sm transition hover:border-blue-200 hover:bg-blue-50" [attr.aria-expanded]="userMenuOpen()" aria-haspopup="menu" (click)="toggleUserMenu()">
          <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-blue-700 to-blue-500 text-sm font-bold text-white shadow-sm shadow-blue-700/20">{{ initials() }}</span>
          <span class="hidden text-left sm:block">
            <span class="block max-w-44 truncate text-sm font-semibold text-slate-800">{{ user()?.fullName || user()?.email }}</span>
            <span class="block max-w-44 truncate text-xs font-medium text-slate-500">{{ primaryRole() }}</span>
          </span>
          <svg class="hidden h-4 w-4 text-slate-400 sm:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
          </svg>
        </button>

        @if (userMenuOpen()) {
          <div class="absolute right-0 mt-3 w-64 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl shadow-slate-900/10" role="menu">
            <div class="border-b border-slate-100 px-4 py-3">
              <p class="truncate text-sm font-semibold text-slate-900">{{ user()?.fullName }}</p>
              <p class="truncate text-xs text-slate-500">{{ user()?.email }}</p>
            </div>
            <button type="button" class="flex w-full items-center gap-3 px-4 py-3 text-left text-sm font-medium text-slate-600 transition hover:bg-slate-50 hover:text-blue-700" role="menuitem" (click)="logout()">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
              </svg>
              Cerrar sesion
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</header>
